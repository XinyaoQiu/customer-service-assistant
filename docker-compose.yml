services:
  mysql:
    image: mysql:8.4
    container_name: cs-assistant-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: publisher
      MYSQL_USER: cs
      MYSQL_PASSWORD: cs
    ports:
      - "3307:3306"
    volumes:
      - cs-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucs", "-pcs"]
      interval: 5s
      timeout: 3s
      retries: 20

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.2
    container_name: cs-assistant-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      QUERY_DEFAULTS_LIMIT: 25
    volumes:
      - cs-weaviatedata:/var/lib/weaviate

volumes:
  cs-mysqldata:
  cs-weaviatedata:
