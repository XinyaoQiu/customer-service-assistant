[project]
name = "cs-assistant"
version = "0.1.0"
description = "Publisher support assistant: status diagnosis, distribution, policy retrieval, escalation"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-google-genai>=4.3",
    "langchain-weaviate>=0.0.5",
    "weaviate-client>=4.10",
    "pymysql>=1.1",
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.scripts]
cs-assistant = "cs_assistant.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_assistant"]
